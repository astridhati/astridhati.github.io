# Sveltia CMS — see docs/ADMIN_SETUP.md
backend:
  name: github
  repo: astridhati/astridhati.github.io
  branch: feature/uploads
  base_url: https://sveltia-cms-auth.astridhati-92.workers.dev
  auth_methods:
    - oauth
  skip_ci: true # saves commit without rebuilding; use Publish Changes when done

media_folder: public/images
public_folder: /images

locale: it

collections:
  - name: site
    label: Impostazioni sito
    files:
      - name: identity
        label: Chi sono
        file: content/site/identity.json
        fields:
          - { label: Nome, name: name, widget: string }
          - { label: Tagline (IT), name: tagline, widget: string }
          - { label: Tagline (EN), name: tagline_en, widget: string, required: false }
          - { label: Bio (IT), name: bio, widget: text }
          - { label: Bio (EN), name: bio_en, widget: text, required: false }
          - { label: Titolo pagina (IT), name: title, widget: string }
          - { label: Page title (EN), name: title_en, widget: string, required: false }
          - { label: Foto, name: image, widget: image, required: false }

      - name: header
        label: Header
        file: content/site/header.json
        fields:
          - { label: Logo, name: logo, widget: image, required: false }
          - { label: Pulsante Contattami (IT), name: contactButton, widget: string }
          - { label: Contact button (EN), name: contactButton_en, widget: string, required: false }
          - label: Menu navigazione
            name: nav
            widget: object
            fields:
              - { label: Chi sono (IT), name: about, widget: string }
              - { label: About (EN), name: about_en, widget: string, required: false }
              - { label: Categorie (IT), name: categories, widget: string }
              - { label: Categories (EN), name: categories_en, widget: string, required: false }
              - { label: Galleria (IT), name: gallery, widget: string }
              - { label: Gallery (EN), name: gallery_en, widget: string, required: false }
              - { label: Contatti (IT), name: contact, widget: string }
              - { label: Contact (EN), name: contact_en, widget: string, required: false }

      - name: home
        label: Homepage
        file: content/site/home.json
        fields:
          - { label: Sfondo hero, name: heroBackground, widget: image, required: false }
          - { label: Testo benvenuto (IT), name: welcome, widget: text, hint: "Testo sotto l'hero, senza titolo" }
          - { label: Welcome text (EN), name: welcome_en, widget: text, required: false }

      - name: pages-gallery
        label: "Pagina: Galleria"
        file: content/site/pages-gallery.json
        fields:
          - { label: Titolo (IT), name: title, widget: string }
          - { label: Title (EN), name: title_en, widget: string, required: false }
          - { label: Intro (IT), name: intro, widget: text }
          - { label: Intro (EN), name: intro_en, widget: text, required: false }
          - { label: Messaggio vuoto (IT), name: empty, widget: string }
          - { label: Empty message (EN), name: empty_en, widget: string, required: false }

      - name: pages-contact
        label: "Pagina: Contatti"
        file: content/site/pages-contact.json
        fields:
          - { label: Titolo (IT), name: title, widget: string }
          - { label: Title (EN), name: title_en, widget: string, required: false }
          - { label: Intro (IT), name: intro, widget: text }
          - { label: Intro (EN), name: intro_en, widget: text, required: false }
          - { label: Prefisso email (IT), name: emailPrefix, widget: string }
          - { label: Email prefix (EN), name: emailPrefix_en, widget: string, required: false }
          - { label: Pulsante email (IT), name: emailButton, widget: string }
          - { label: Email button (EN), name: emailButton_en, widget: string, required: false }
          - { label: Titolo social (IT), name: socialHeading, widget: string }
          - { label: Social heading (EN), name: socialHeading_en, widget: string, required: false }

      - name: pages-categories
        label: "Pagina: Categorie"
        file: content/site/pages-categories.json
        fields:
          - { label: Etichetta opere (IT), name: worksLabel, widget: string }
          - { label: Works label (EN), name: worksLabel_en, widget: string, required: false }
          - { label: Messaggio vuoto (IT), name: empty, widget: string }
          - { label: Empty message (EN), name: empty_en, widget: string, required: false }

      - name: footer
        label: Footer
        file: content/site/footer.json
        fields:
          - { label: Email, name: email, widget: string, required: false }
          - label: Social
            name: social
            widget: object
            required: false
            fields:
              - { label: Instagram, name: instagram, widget: string, required: false }
              - { label: Behance, name: behance, widget: string, required: false }
              - { label: Pinterest, name: pinterest, widget: string, required: false }
              - { label: TikTok, name: tiktok, widget: string, required: false }
              - { label: Twitter / X, name: twitter, widget: string, required: false }
              - { label: Facebook, name: facebook, widget: string, required: false }
              - { label: LinkedIn, name: linkedin, widget: string, required: false }
              - { label: YouTube, name: youtube, widget: string, required: false }

  - name: categories
    label: Categorie
    label_singular: Categoria
    folder: content/categories
    create: true
    slug: "{{id}}"
    identifier_field: id
    summary: "{{name}}"
    extension: json
    format: json
    fields:
      - label: ID (slug cartella)
        name: id
        widget: string
        hint: "Es. attivismo — solo lettere minuscole, numeri e trattini, senza spazi"
        pattern:
          - '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          - 'Solo lettere minuscole, numeri e trattini — niente spazi.'
      - { label: Nome (IT), name: name, widget: string }
      - { label: Name (EN), name: name_en, widget: string, required: false }
      - { label: Anno, name: year, widget: string }
      - { label: Descrizione (IT), name: description, widget: text, hint: "Mostrata nella pagina categoria e usata per SEO" }
      - { label: Description (EN), name: description_en, widget: text, required: false, hint: "Shown on the category page and used for SEO" }

  - name: drawings
    label: Disegni
    label_singular: Disegno
    folder: content/drawings
    media_folder: /public/images/drawings
    public_folder: /images/drawings
    create: true
    slug: "{{id}}"
    identifier_field: id
    summary: "{{title}}"
    extension: json
    format: json
    fields:
      - label: ID (slug file)
        name: id
        widget: string
        hint: "Es. angry-females — solo lettere minuscole, numeri e trattini, senza spazi"
        pattern:
          - '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          - 'Solo lettere minuscole, numeri e trattini — niente spazi.'
      - { label: Titolo (IT), name: title, widget: string }
      - { label: Title (EN), name: title_en, widget: string, required: false }
      - { label: Anno, name: year, widget: string }
      - { label: Descrizione (IT), name: description, widget: text, required: false }
      - { label: Description (EN), name: description_en, widget: text, required: false }
      - label: Tipo
        name: grouped
        widget: select
        default: single
        options:
          - { label: Singolo — una immagine, value: single }
          - { label: Gruppo — carousel in galleria, value: multiple }
      - label: Categoria
        name: category
        widget: relation
        collection: categories
        value_field: id
        display_fields: [name]
        search_fields: [name, id]
        required: false
        hint: "Opzionale — lascia vuoto per altri lavori (mostrati per primi in galleria)"
      - label: Immagine
        name: image
        widget: image
        required: false
        hint: "Solo per disegni singoli"
        condition:
          field: grouped
          value: single
      - label: Copertina
        name: cover
        widget: image
        required: false
        hint: "Anteprima in galleria"
        condition:
          field: grouped
          value: multiple
      - label: Immagini del gruppo
        name: images
        widget: list
        required: false
        hint: "Ordine = ordine nel carousel"
        condition:
          field: grouped
          value: multiple
        field: { label: Immagine, name: image, widget: image }
