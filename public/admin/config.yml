# Sveltia CMS — see docs/ADMIN_SETUP.md
backend:
  name: github
  repo: astridhati/astridhati.github.io
  branch: feature/uploads
  base_url: https://sveltia-cms-auth.astridhati-92.workers.dev
  auth_methods:
    - oauth
  skip_ci: true # saves commit without rebuilding; use Publish Changes when done

media_folder: public/images/drawings
public_folder: /images/drawings

locale: it

collections:
  - name: site
    label: Impostazioni sito
    files:
      - name: site
        label: Sito
        file: content/site.json
        fields:
          - { label: Nome, name: name, widget: string }
          - { label: Tagline (IT), name: tagline, widget: string }
          - { label: Tagline (EN), name: tagline_en, widget: string, required: false }
          - { label: Bio (IT), name: bio, widget: text }
          - { label: Bio (EN), name: bio_en, widget: text, required: false }
          - { label: Email, name: email, widget: string, required: false }
          - { label: Sfondo hero, name: heroBackground, widget: image, required: false, media_folder: public/images, public_folder: /images }
          - { label: Logo, name: logo, widget: image, required: false, media_folder: public/images, public_folder: /images }
          - label: Social
            name: social
            widget: object
            required: false
            fields:
              - { label: Instagram, name: instagram, widget: string, required: false }
              - { label: Behance, name: behance, widget: string, required: false }
              - { label: Pinterest, name: pinterest, widget: string, required: false }
              - { label: TikTok, name: tiktok, widget: string, required: false }
              - { label: Twitter / X, name: twitter, widget: string, required: false }
              - { label: Facebook, name: facebook, widget: string, required: false }
              - { label: LinkedIn, name: linkedin, widget: string, required: false }
              - { label: YouTube, name: youtube, widget: string, required: false }
          - label: Homepage
            name: homepage
            widget: object
            required: false
            fields:
              - label: Progetti in homepage
                name: featuredProjects
                widget: list
                max: 6
                required: false
                hint: "Progetti mostrati nella sezione Progetti (max 6)"
                field:
                  label: Progetto
                  name: project
                  widget: relation
                  collection: projects
                  value_field: id
                  search_fields: [name, id]
                  display_fields: [name]
              - label: Disegni in evidenza
                name: featuredDrawings
                widget: list
                max: 3
                required: false
                hint: "Opere mostrate in In evidenza, collegate alla galleria (max 3)"
                field:
                  label: Disegno
                  name: drawing
                  widget: relation
                  collection: drawings
                  value_field: id
                  search_fields: [title, id]
                  display_fields: [title]

  - name: projects
    label: Progetti
    label_singular: Progetto
    folder: content/projects
    create: true
    slug: "{{id}}"
    identifier_field: id
    summary: "{{name}}"
    extension: json
    format: json
    fields:
      - { label: ID (slug cartella), name: id, widget: string, hint: "Es. attivismo — nome cartella in images/drawings/" }
      - { label: Nome (IT), name: name, widget: string }
      - { label: Name (EN), name: name_en, widget: string, required: false }
      - { label: Copertina, name: cover, widget: image }
      - { label: Anno, name: year, widget: string }
      - { label: Descrizione (IT), name: description, widget: text }
      - { label: Description (EN), name: description_en, widget: text, required: false }
      - { label: Titolo SEO (IT), name: seoTitle, widget: string, required: false }
      - { label: SEO title (EN), name: seoTitle_en, widget: string, required: false }
      - { label: Descrizione SEO (IT), name: seoDescription, widget: text, required: false }
      - { label: SEO description (EN), name: seoDescription_en, widget: text, required: false }

  - name: drawings
    label: Disegni
    label_singular: Disegno
    folder: content/drawings
    create: true
    slug: "{{id}}"
    identifier_field: id
    summary: "{{title}}"
    extension: json
    format: json
    fields:
      - { label: ID (slug file), name: id, widget: string, hint: "Es. angry-females — usato per homepage e nome file" }
      - { label: Titolo (IT), name: title, widget: string }
      - { label: Title (EN), name: title_en, widget: string, required: false }
      - { label: Anno, name: year, widget: string }
      - { label: Descrizione (IT), name: description, widget: text, required: false }
      - { label: Description (EN), name: description_en, widget: text, required: false }
      - label: Tipo
        name: grouped
        widget: select
        default: single
        options:
          - { label: Singolo — una immagine, value: single }
          - { label: Gruppo — carousel in galleria, value: multiple }
      - label: Progetto
        name: project
        widget: relation
        collection: projects
        value_field: id
        display_fields: [name]
        search_fields: [name, id]
        required: false
        hint: "Opzionale — lascia vuoto per altri lavori (mostrati per primi in galleria)"
      - label: Immagine
        name: image
        widget: image
        required: false
        hint: "Solo per disegni singoli"
        condition:
          field: grouped
          value: single
      - label: Copertina
        name: cover
        widget: image
        required: false
        hint: "Anteprima in galleria"
        condition:
          field: grouped
          value: multiple
      - label: Immagini del gruppo
        name: images
        widget: list
        required: false
        hint: "Ordine = ordine nel carousel"
        condition:
          field: grouped
          value: multiple
        field: { label: Immagine, name: image, widget: image }
